[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "random-forest-from-scratch"
version = "1.0.0"
description = "A from-scratch Random Forest for multiclass wine-quality prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
include = ["random_forest_scratch*"]
